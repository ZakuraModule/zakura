[package]
name = "zakura-geyser-plugin-manager"
version = "0.1.0"
authors.workspace = true
description = "Bounded, isolated runtime for Zakura Geyser plugins"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["asynchronous", "cryptography::cryptocurrencies"]

[dependencies]
humantime-serde = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zakura-geyser-plugin-interface = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = { workspace = true }
zakura-chain = { path = "../zakura-chain", version = "8.0.0" }

[lints]
workspace = true
